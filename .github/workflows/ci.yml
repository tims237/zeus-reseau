name: CI

on:
  push:
  pull_request:

jobs:
  qualite:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer le projet et les outils
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: |
          ruff check .
          ruff format --check .

      - name: Typage (mypy)
        run: mypy

      - name: Tests (pytest)
        run: pytest